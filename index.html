<head>

<style>
:root{--b:#D7191F;--bd:#A8121A;--light:#FFF4D2;--gold:#F5B800;--blue:#2B308C;--ink:#2A1F1F;--mut:#6B5E57;--line:#F0E3C6;--grey:#857A72;--warn:#B54708;--ok:#15803D;--field:#E2D2AC}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#FFF8E6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;min-height:100%;background:#fff;display:flex;flex-direction:column;position:relative}
button,input,select{font:inherit;color:inherit}
.hdr{background:var(--b);color:#fff;border-bottom:3px solid var(--gold);padding:14px 12px 12px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5;padding-top:calc(14px + env(safe-area-inset-top))}
.hdr h1{margin:0;font-size:19px;font-weight:700}
.hdr .sub{margin:2px 0 0;font-size:13px;color:#FFE7A3}
.icon-btn{background:none;border:0;color:inherit;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;cursor:pointer;flex:none}
.icon-btn:active{background:rgba(255,255,255,.15)}
.body{flex:1;display:flex;flex-direction:column;padding-bottom:76px}
.strip{background:var(--light);padding:12px 16px;display:flex;justify-content:space-between;gap:8px;font-size:15px;font-weight:600}
.pad{padding:16px;display:flex;flex-direction:column;gap:14px}
.search{padding:10px 16px;border-bottom:1px solid var(--line)}
input.in,select.in{width:100%;border:1px solid var(--field);border-radius:10px;padding:12px 14px;font-size:16px;background:#fff;min-height:48px}
input.in:focus,select.in:focus{outline:2px solid var(--b);outline-offset:0;border-color:var(--b)}
label.lb{font-size:13px;font-weight:600;color:var(--mut);display:block;margin-bottom:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:#fff;width:100%;text-align:left;cursor:pointer;min-height:64px}
.row:active{background:var(--light)}
.rn{margin:0;font-size:17px;font-weight:600}
.rs{margin:2px 0 0;font-size:14px;color:var(--mut)}
.rq{margin:0;font-size:17px;font-weight:700;color:var(--b);white-space:nowrap}
.badge{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;color:var(--warn);background:#FEF3E8;border-radius:10px;padding:2px 8px}
.btn{background:var(--b);color:#fff;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700;min-height:52px;width:100%;cursor:pointer}
.btn:active{background:var(--bd)}
.btn[disabled]{opacity:.6}
.btn.out{background:#fff;color:var(--b);border:1px solid var(--b)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#fff;border:1px solid var(--field);border-radius:22px;padding:10px 16px;font-size:15px;font-weight:600;min-height:44px;cursor:pointer}
.chip.on{background:var(--b);border-color:var(--b);color:#fff}
.qty{display:flex;gap:8px;align-items:center}
.qty .in{text-align:center;font-size:20px;font-weight:700}
.qbtn{width:52px;height:52px;flex:none;border-radius:12px;border:1px solid var(--field);background:#fff;font-size:24px;font-weight:700;color:var(--b);cursor:pointer}
.info{background:var(--light);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{background:var(--light);border-radius:12px;padding:12px;border-left:4px solid var(--gold)}
.card p{margin:0}.card .k{font-size:12px;color:var(--mut)}.card .v{font-size:20px;font-weight:800;margin-top:2px}
.sec{margin:6px 0 0;font-size:13px;font-weight:700;color:var(--mut);letter-spacing:.5px}
.li{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:10px}
.li p{margin:0}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);display:grid;padding-bottom:env(safe-area-inset-bottom);z-index:6}
.nav button{background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font-size:12px;font-weight:500;min-height:60px;cursor:pointer}
.nav button.on{color:var(--b);font-weight:700;box-shadow:inset 0 3px 0 var(--gold)}
.credit{margin:auto 0 0;padding:14px 16px 8px;font-size:11px;color:var(--grey);text-align:center}
.wa{width:44px;height:44px;border-radius:22px;background:#E7F6EC;color:var(--ok);display:flex;align-items:center;justify-content:center;flex:none;text-decoration:none}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#1F2A37;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;max-width:90%;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.menu{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex}
.menu .panel{background:#fff;width:78%;max-width:320px;height:100%;padding:calc(24px + env(safe-area-inset-top)) 0 24px;display:flex;flex-direction:column}
.menu .who{padding:0 20px 16px;border-bottom:1px solid var(--line)}
.menu .item{background:none;border:0;text-align:left;padding:16px 20px;font-size:16px;font-weight:600;cursor:pointer;min-height:52px}
.login{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:32px 24px;background:radial-gradient(circle at 50% 0,#FFE38A 0,#FFF4D2 38%,#fff 75%)}
.logo{width:132px;height:132px;display:block;margin:0 auto;border-radius:50%;box-shadow:0 10px 28px rgba(215,25,31,.28)}
.credit .jm,.jm{width:14px;height:14px;vertical-align:-2px;margin-right:5px;border-radius:3px}
.hlogo{width:34px;height:34px;border-radius:50%;background:#fff;flex:none;box-shadow:0 0 0 2px var(--gold)}
.center{text-align:center}
.rn.big{font-size:20px}
.pill{display:inline-block;border-radius:14px;padding:4px 10px;font-weight:800;font-size:16px;white-space:nowrap;margin-left:4px}
.pill.cow{background:#FFF4D2;color:#7A4B00;border:1px solid #F5B800}.pill.bh{background:#2A1F1F;color:#fff}.pill.off{background:#FEE4E2;color:#B42318}
.spk{border:0;background:var(--light);border-radius:18px;width:40px;height:36px;font-size:18px;cursor:pointer}
.row.st-band{background:#FEE4E2;border-left:6px solid #D7191F}.row.st-chg{background:#FFF1C2;border-left:6px solid var(--gold)}
.shiftbar{padding:10px 16px 0}.chip.big{font-size:17px;padding:12px 18px;min-height:52px;flex:1;justify-content:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:12px 16px;font-size:13px;color:var(--mut)}.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:5px;vertical-align:-2px}
.err{color:#B42318;font-size:14px;margin:0}
.empty{padding:32px 16px;text-align:center;color:var(--mut)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--b);border-radius:50%;animation:sp 0.8s linear infinite;margin:40px auto}
@media print{body *{visibility:hidden}#billbox,#billbox *{visibility:visible}#billbox{position:absolute;left:0;top:0;width:100%}}
@keyframes sp{to{transform:rotate(360deg)}}
.offline{background:#FEF3E8;color:var(--warn);font-size:13px;font-weight:600;padding:8px 16px;text-align:center}
.demo{background:#FFF7D6;color:#7A5A00;font-size:12px;font-weight:600;padding:6px 16px;text-align:center}
.hrow{gap:12px}.hno{min-width:46px;height:46px;border-radius:12px;background:var(--light);border:1px solid #F2C94C;color:#7A4B00;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none;padding:0 4px}
.sumbar{display:flex;gap:8px;padding:10px 16px;background:var(--light)}.sumbar>div{flex:1;background:#fff;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}.sumbar b{font-size:20px}.sumbar span{font-size:12px;color:var(--mut)}.sumbar .hot{background:#FFF1C2}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{border:0;border-radius:18px;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.08)}.tile .ti{font-size:40px;line-height:1}.tile:active{transform:scale(.97)}
.t-milk{background:#FFF4D2;color:#7A4B00}.t-bag{background:#EAF2FF;color:#1849A9}.t-pay{background:#E7F6EC;color:#05603A}.t-off{background:#FEE4E2;color:#B42318}
.qbox{display:flex;flex-direction:column;gap:8px}.qlab{margin:0;font-size:17px;font-weight:800}.lchips .chip{flex:1;min-width:0;padding:10px 0;font-size:17px;font-weight:800}
.btn.big{min-height:60px;font-size:19px}.btn.pay{background:#05603A}.btn.pay[disabled]{background:#9AA4B2;opacity:1}
.balcard{position:relative;background:#FFF1C2;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column}.balcard span{font-size:14px;font-weight:700;color:#7A4B00}.balcard b{font-size:34px;font-weight:900}.balcard small{font-size:13px;color:var(--mut)}.balcard .spk{position:absolute;right:12px;top:12px}.balcard.ok{background:#E7F6EC}.balcard.ok span{color:#05603A}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ibtn{border:1px solid var(--field);background:#fff;border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:64px;cursor:pointer;font-size:16px}.ibtn span{font-size:13px;color:var(--mut)}.ibtn.on{border:2px solid #1849A9;background:#EAF2FF}
.ck{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;min-height:48px}.ck input{width:26px;height:26px}
.langbtn{background:#fff;color:var(--b);border:0;border-radius:18px;min-width:40px;height:36px;font-weight:800;font-size:16px;cursor:pointer;flex:none}
.doneov{position:fixed;inset:0;background:rgba(5,96,58,.92);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;animation:fi .15s ease-out}.donecard{text-align:center;color:#fff;display:flex;flex-direction:column;gap:16px;align-items:center;max-width:360px;width:100%}.tick{width:120px;height:120px;border-radius:60px;background:#fff;color:#05603A;font-size:76px;font-weight:900;display:flex;align-items:center;justify-content:center;animation:pop .3s ease-out}.dmsg{margin:0;font-size:22px;font-weight:800}.doneov .btn.out{background:#fff;color:#B42318;border:0}
@keyframes pop{0%{transform:scale(.4)}80%{transform:scale(1.1)}100%{transform:scale(1)}}@keyframes fi{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<div id="stalebar" role="status" style="display:none;position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#FFF4CC;color:#7A4B00;border:1px solid #F2C94C;padding:4px 12px;border-radius:999px;font-size:13px;z-index:15;box-shadow:0 2px 8px rgba(0,0,0,.12)">⟳ Naya data aa raha hai…</div>
<script>
/* ============ CONFIG ============ */
const API_URL = 'https://script.google.com/macros/s/AKfycbxEaQ9qdFevDyHL_aDLAuf1i3hjZwl3H-Lhs_83xjqS2_yjuanUGi1CIwzSX3wN3g1B/exec';            // Apps Script web app URL (…/exec). Khali = demo mode
const UPI_ID = '[UPI ID]';      // SKDMB ka UPI ID
const BRAND = { short: 'SKDMB Doodh', full: 'Shree Krishna Dudh Misthan Bhandar', addr: '8-A, Bal Nagar, Mahesh Nagar, Jaipur' };
const CREDIT = 'Powered by Jinovate — Smart solutions for your business';
const JMARK = '<img class="jm" src="jmark-32.png" alt="Jinovate">';
const DEMO = false;

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L = n => (Math.round(Number(n) * 100) / 100) + ' L';
const R = n => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const showDate = s => { const p = String(s).split('-'); return p.length === 3 ? p[2] + '-' + p[1] + '-' + p[0] : s; };
const ICON = {
  menu: 'M4 7h16M4 12h16M4 17h16', back: 'M15 6l-6 6 6 6',
  route: 'M3 12l9-8 9 8M5 10v10h14V10', edit: 'M4 20h4L20 8l-4-4L4 16v4z', pay: 'M3 7h18v10H3zM3 11h18',
  sum: 'M4 20V10M10 20V4M16 20v-7M22 20H2', bill: 'M6 2h12v20l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6',
  wa: 'M4 20l1.3-4A8 8 0 1 1 8 19z', bag: 'M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2', pdf: 'M6 2h9l5 5v15H6zM14 2v6h6M9 14h6M9 18h4', x: 'M6 6l12 12M18 6L6 18', refresh: 'M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7'
};
const svg = (k, s = 24) => `<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${ICON[k]}"/></svg>`;
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* ============ session + api ============ */
/* storage that never crashes: falls back to memory when the browser blocks it (iframes, private mode) */
const MEM = {};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return k in MEM ? MEM[k] : null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { MEM[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { delete MEM[k]; } }
};
let S = null; try { S = JSON.parse(store.get('skdmb_session') || 'null'); } catch (e) { S = null; }
const saveSession = () => store.set('skdmb_session', JSON.stringify(S));

async function api(action, data = {}) {
  if (DEMO) return demoApi(action, data); // demoApi exists only in demo.html
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, token: S && S.token }, data)) });
  const j = await res.json();
  if (!j.ok) {
    if (j.error === 'LOGIN') { logout(true); throw new Error(j.msg || 'Dobara login karo'); }
    throw new Error(j.error || 'Kuch gadbad hui');
  }
  return j;
}

/* offline outbox: saves that failed for network reasons are kept and resent later */
const outbox = () => JSON.parse(store.get('skdmb_outbox') || '[]');
const setOutbox = q => store.set('skdmb_outbox', JSON.stringify(q));
async function send(action, data) {
  try { return await api(action, data); }
  catch (e) {
    if (!navigator.onLine || e instanceof TypeError) {
      const q = outbox(); q.push({ action, data, at: Date.now() }); setOutbox(q);
      return { ok: true, queued: true };
    }
    throw e;
  }
}
async function flushOutbox() {
  const q = outbox(); if (!q.length || !navigator.onLine || !S) return;
  const left = [];
  for (const item of q) {
    try { await api(item.action, item.data); } catch (e) { if (e instanceof TypeError) left.push(item); }
  }
  setOutbox(left);
  if (q.length !== left.length) toast((q.length - left.length) + ' entry bhej di gayi');
}
window.addEventListener('online', () => { flushOutbox(); render(); });
window.addEventListener('offline', () => render());

/* ============ state ============ */
const V = { tab: null, date: todayStr(), cust: null, menu: false, about: false, boyId: null, cache: {} };
function logout(silent) {
  if (S && !DEMO && !silent) api('logout').catch(() => {});
  store.del(pcKey()); PC = null; PCK = ''; S = null; store.del('skdmb_session'); Object.assign(V, { tab: null, cust: null, menu: false, about: false, cache: {} });
  render();
}
const isOwner = () => S && ['Owner', 'Admin'].includes(S.user.role);
const isAdmin = () => S && S.user.role === 'Admin';

/* ============ layout pieces ============ */
function header(title, sub, back) {
  return `<header class="hdr">
    <button class="icon-btn" aria-label="${back ? 'Peeche' : 'Menu'}" onclick="${back ? back : 'openMenu()'}">${svg(back ? 'back' : 'menu')}</button>
    ${back ? '' : '<img class="hlogo" src="logo-256.png" alt="">'}<div style="flex:1;min-width:0"><h1>${esc(title)}</h1>${sub ? `<p class="sub">${esc(sub)}</p>` : ''}</div>
    ${S && !isOwner() ? `<button class="langbtn" aria-label="Bhasha badlo" onclick="toggleLang()">${HI() ? 'Aa' : 'अ'}</button>` : ''}<button class="icon-btn" aria-label="Refresh" onclick="refresh()">${svg('refresh', 22)}</button>
  </header>${!navigator.onLine ? `<div class="offline">📵 ${tx('Net nahi hai. Entry phone mein save hogi, net aate hi chali jayegi.', 'नेट नहीं है। एंट्री फ़ोन में सेव होगी, नेट आते ही चली जाएगी।')}</div>` : ''}${outbox().length ? `<div class="offline">⏳ ${outbox().length} ${tx('entry bhejna baaki hai', 'एंट्री भेजनी बाकी है')}</div>` : ''}${DEMO ? '<div class="demo">Demo mode: sample data, sheet mein kuch save nahi hota</div>' : ''}`;
}
function nav(items) {
  return `<nav class="nav" style="grid-template-columns:repeat(${items.length},minmax(0,1fr))">` + items.map(([key, label, icon]) =>
    `<button class="${V.tab === key || (key === 'route' && ['ghar', 'change', 'saman', 'payment', 'chhutti'].includes(V.tab)) ? 'on' : ''}" onclick="buzz();go('${key}')">${svg(icon)}<span>${HI() ? ({ route: 'मेरा रूट', din: 'मेरा दिन' }[key] || label) : label}</span></button>`).join('') + '</nav>';
}
function openMenu() { V.menu = true; render(); }
function closeMenu() { V.menu = false; render(); }
function menuHtml() {
  return `<div class="menu" onclick="if(event.target===this)closeMenu()"><div class="panel">
    <div class="who"><p style="margin:0;font-size:18px;font-weight:700">${esc(S.user.name)}</p><p class="rs">${esc(S.user.role === 'Boy' ? 'Delivery boy' : S.user.role)}</p></div>
    ${isOwner() ? `<button class="item" onclick="V.menu=false;V.about=false;V.tab='staff';render()">Staff / Login control</button><button class="item" onclick="V.menu=false;V.about=false;V.tab='rates';render()">Doodh ka rate</button>` : ''}
    <button class="item" onclick="V.menu=false;changeMyPin()">Mera PIN badlo</button>
    <button class="item" onclick="V.menu=false;V.about=true;render()">About</button>
    <button class="item" onclick="logout()">Logout</button>
  </div></div>`;
}
function go(tab) { V.tab = tab; V.about = false; V.billId = null; V.stock = null; if (!['change', 'payment', 'saman', 'ghar', 'chhutti'].includes(tab)) V.cust = null; render(); }
function refresh() { V.cache = {}; flushOutbox(); render(); }

/* ============ screens ============ */
function loginHtml(err) {
  return `<div class="login">
    <div class="center"><img class="logo" src="logo-256.png" alt="SKDMB logo">
      <h1 style="margin:16px 0 4px;font-size:26px">${BRAND.short}</h1><p class="rs" style="margin:0">${BRAND.full}</p><p class="rs" style="margin:2px 0 0;font-size:12px">${BRAND.addr}</p></div>
    <form onsubmit="doLogin(event)" style="display:flex;flex-direction:column;gap:14px">
      <div><label class="lb" for="mob">Mobile number</label><input class="in" id="mob" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10 digit mobile" required></div>
      <div><label class="lb" for="pin">PIN</label><input class="in" id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="6 digit PIN" required></div>
      ${err ? `<p class="err">${esc(err)}</p>` : ''}
      <button class="btn" id="lbtn">Login</button>
    </form>
    
  </div>`;
}
async function doLogin(e) {
  e.preventDefault();
  const b = $('#lbtn'); b.disabled = true; b.textContent = 'Ruko…';
  try {
    const r = await api('login', { mobile: $('#mob').value, pin: $('#pin').value });
    S = { token: r.token, user: r.user, day: todayStr() }; saveSession();
    V.tab = isOwner() ? 'aaj' : 'route'; render(); flushOutbox();
  } catch (er) { $('#app').innerHTML = loginHtml(er.message); }
}

/* Turant khulna: pichhli baar ka data phone mein rakha rehta hai. Screen usi se turant khulti hai,
   peeche se naya data aata hai aur screen apne aap update ho jaati hai (upar "update ho raha hai" dikhta hai). */
const pcKey = () => 'skdmb_pc_' + (S ? S.user.role + '_' + S.user.name : '');
let PC = null, PCK = '';
function pc() { if (PCK !== pcKey()) { PCK = pcKey(); try { PC = JSON.parse(store.get(PCK) || '{}'); } catch (e) { PC = {}; } } return PC; }
function pcPut(key, d) {
  const c = pc(); c[key] = { d, t: Date.now() };
  const ks = Object.keys(c).sort((a, b) => c[b].t - c[a].t); ks.slice(30).forEach(k => delete c[k]);
  try { store.set(PCK, JSON.stringify(c)); } catch (e) { ks.slice(10).forEach(k => delete c[k]); try { store.set(PCK, JSON.stringify(c)); } catch (e2) {} }
}
const PEND = {};
const staleBar = () => { const b = $('#stalebar'); if (b) { b.style.display = Object.keys(PEND).length ? 'block' : 'none'; b.textContent = '⟳ ' + tx('Naya data aa raha hai…', 'नया डेटा आ रहा है…'); } };
const typing = () => { const a = document.activeElement; return !!a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.type !== 'date'; };
async function load(key, fn) {
  if (V.cache[key]) return V.cache[key];
  const old = DEMO ? null : pc()[key];
  if (!old) { const r = await fn(); V.cache[key] = r; if (!DEMO) pcPut(key, r); return r; }
  if (!PEND[key]) {
    const who = pcKey();
    PEND[key] = fn().then(r => {
      delete PEND[key]; if (pcKey() !== who) return;
      const changed = JSON.stringify(r) !== JSON.stringify(V.cache[key]);
      V.cache[key] = r; pcPut(key, r);
      if (changed && !typing()) { if (key.startsWith('route_')) V.routeData = null; render(); } else staleBar();
    }).catch(() => { delete PEND[key]; staleBar(); });
  }
  V.cache[key] = old.d; setTimeout(staleBar, 0);
  return old.d;
}

const COW = '🐄', BH = '🐃';
V.shift = V.shift || (new Date().getHours() < 14 ? 'Subh' : 'Sham');
function shiftChips() {
  return `<div class="chips shiftbar">${[['Subh', shiftName('Subh')], ['Sham', shiftName('Sham')]].map(([s, t]) => `<button type="button" class="chip big ${V.shift === s ? 'on' : ''}" onclick="V.shift='${s}';V.routeData=null;V.cache={};render()">${t}</button>`).join('')}</div>`;
}
function pills(cow, bh) {
  const p = [];
  if (cow) p.push(`<span class="pill cow">${COW} ${L(cow)}</span>`);
  if (bh) p.push(`<span class="pill bh">${BH} ${L(bh)}</span>`);
  return p.join('') || '<span class="pill off">0</span>';
}
function sayQty(cow, bh) {
  const n = x => String(x).replace('.5', ' aadha');
  const p = []; if (cow) p.push('gaay ' + n(cow) + ' litre'); if (bh) p.push('bhains ' + n(bh) + ' litre');
  return p.join(', ') || 'aaj doodh nahi';
}
function speak(t) {
  try {
    if (!('speechSynthesis' in window)) return toast('Is phone mein bolne ki suvidha nahi');
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t); u.lang = 'hi-IN'; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(x => /hi[-_]IN/i.test(x.lang)); if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
let LOC = null;
function getLoc() {
  return new Promise(res => {
    if (LOC && Date.now() - LOC.t < 60000) return res(LOC);
    if (!navigator.geolocation) return res({});
    let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    setTimeout(() => fin(LOC || {}), 7000);
    navigator.geolocation.getCurrentPosition(p => { LOC = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() }; fin(LOC); }, () => fin({}), { enableHighAccuracy: true, timeout: 6500, maximumAge: 30000 });
  });
}
async function withLoc(data) { const l = await getLoc(); return Object.assign({}, data, l.lat ? { lat: l.lat, lng: l.lng, acc: l.acc } : {}); }
const mapLink = (lat, lng) => `https://www.google.com/maps?q=${lat},${lng}`;
const farTxt = m => m == null ? '' : m > 150 ? `<span class="badge" style="color:#B42318;background:#FEE4E2">⚠️ ghar se ${m} m door</span>` : `<span class="badge" style="color:var(--ok);background:#E7F6EC">📍 ghar pe</span>`;

let DONE_T = null;
function done(msg, sayText, undo) {
  buzz([40, 60, 40]); if (sayText) speak(sayText);
  const old = $('#doneov'); if (old) old.remove(); clearTimeout(DONE_T);
  const d = document.createElement('div'); d.id = 'doneov'; d.className = 'doneov'; d.setAttribute('role', 'status');
  d.innerHTML = `<div class="donecard"><div class="tick">✓</div><p class="dmsg">${esc(msg)}</p>${undo ? `<button class="btn out" id="undobtn">↩️ ${tx('Galti hui? Wapas lo', 'गलती हुई? वापस लो')}</button>` : ''}</div>`;
  d.onclick = e => { if (e.target.id !== 'undobtn') d.remove(); };
  document.body.appendChild(d);
  if (undo) $('#undobtn').onclick = async () => { d.remove(); try { await undo(); toast(tx('Wapas le liya', 'वापस ले लिया')); } catch (e) { toast(e.message); } V.cache = {}; V.routeData = null; render(); };
  DONE_T = setTimeout(() => d.remove(), undo ? 6000 : 1800);
}

  b.textContent = cow + bh === 0 ? tx('🔒 Aaj band — save karo', '🔒 आज बंद — सेव करो') : `${cow ? COW + ' ' + L(cow) + ' ' : ''}${bh ? BH + ' ' + L(bh) + ' ' : ''}— ${tx('save karo', 'सेव करो')}`;

async function saveChange(id) {
  const b = $('#sbtn'); b.disabled = true; const label = b.textContent; b.textContent = tx('Save ho raha hai…', 'सेव हो रहा है…');
  const r0 = await ensureRoute(); const c = houseOf(r0) || {};
  const prev = { cow: c.cow, bh: c.bh, remark: c.remark || '' };
  try {
    const cow = Number($('#qcow').value) || 0, bh = Number($('#qbh').value) || 0;
    const data = await withLoc({ custId: id, date: V.date, shift: V.shift, cow, bh, remark: $('#rem').value.trim(), boyId: V.boyId });
    const res = await send('saveChange', data);
    const nm = c.hindi || c.name || '';
    done(res.queued ? tx('Phone mein save. Net aate hi chala jayega.', 'फ़ोन में सेव। नेट आते ही चला जाएगा।') : nm + ': ' + (cow + bh ? (cow ? COW + ' ' + L(cow) + ' ' : '') + (bh ? BH + ' ' + L(bh) : '') : tx('aaj band', 'आज बंद')),
      tx('Save ho gaya', 'सेव हो गया'),
      res.queued ? null : () => api('saveChange', { custId: id, date: V.date, shift: V.shift, cow: prev.cow, bh: prev.bh, remark: prev.remark, boyId: V.boyId }));
    V.cache = {}; V.routeData = null; V.cust = null; go('route');

function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function monthPeriod(y, m) { return { from: ymd(new Date(y, m, 1)), to: ymd(new Date(y, m + 1, 0)) }; }
function curPeriod() { if (!V.period) { const d = new Date(); V.period = Object.assign({ kind: 'this' }, monthPeriod(d.getFullYear(), d.getMonth())); } return V.period; }
function setPeriod(kind) {
  const d = new Date();
  if (kind === 'this') V.period = Object.assign({ kind }, monthPeriod(d.getFullYear(), d.getMonth()));
  if (kind === 'last') V.period = Object.assign({ kind }, monthPeriod(d.getFullYear(), d.getMonth() - 1));
  if (kind === 'month') { const v = $('#pm').value; if (!v) return toast('Mahina chuno'); const [y, m] = v.split('-').map(Number); V.period = Object.assign({ kind }, monthPeriod(y, m - 1)); }
  if (kind === 'custom') { const f = $('#pf').value, t = $('#pt').value; if (!f || !t || t < f) return toast('Dono tareekh sahi chuno'); V.period = { kind, from: f, to: t }; }
  if (kind === 'pickmonth' || kind === 'pickcustom') { V.period = Object.assign({}, curPeriod(), { kind }); }
  V.cache = {}; V.billId = null; render();
}
function periodBar() {
  const p = curPeriod();
  const chip = (k, t) => `<button type="button" class="chip ${p.kind === k || (k === 'pickmonth' && p.kind === 'month') || (k === 'pickcustom' && p.kind === 'custom') ? 'on' : ''}" onclick="setPeriod('${k}')">${t}</button>`;
  return `<div class="pad" style="padding-bottom:6px;gap:8px"><div class="chips">${chip('this', 'Is mahina')}${chip('last', 'Pichhla mahina')}${chip('pickmonth', 'Mahina-saal')}${chip('pickcustom', 'Custom tareekh')}</div>
    ${['pickmonth', 'month'].includes(p.kind) ? `<div style="display:flex;gap:8px;align-items:flex-end"><div style="flex:1"><label class="lb" for="pm">Mahina</label><input class="in" id="pm" type="month" value="${p.from.slice(0, 7)}"></div><button class="btn" style="width:auto;padding:0 18px" onclick="setPeriod('month')">Dekho</button></div>` : ''}
    ${['pickcustom', 'custom'].includes(p.kind) ? `<div style="display:flex;gap:8px"><div style="flex:1"><label class="lb" for="pf">Se</label><input class="in" id="pf" type="date" value="${p.from}"></div><div style="flex:1"><label class="lb" for="pt">Tak</label><input class="in" id="pt" type="date" value="${p.to}"></div></div><button class="btn" onclick="setPeriod('custom')">Dekho</button>` : ''}</div>`;

/* small built-in PDF writer (used in demo mode, and as a fallback) */
function makeBillPdf(d) {
  const W = 420, H = 595, ops = [];
  const clean = t => String(t).replace(/₹/g, 'Rs.').replace(/×/g, 'x').replace(/[—–]/g, '-').replace(/·/g, '-').replace(/[^\x20-\x7E]/g, '').replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
  const rgb = h => [1, 3, 5].map(i => (parseInt(h.substr(i, 2), 16) / 255).toFixed(3)).join(' ');
  const text = (x, y, t, size = 10, bold = false, color = '#1F2A37', align = 'left') => {
    const w = clean(t).length * size * (bold ? 0.55 : 0.5);
    const xx = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
    ops.push(`BT ${rgb(color)} rg /${bold ? 'F2' : 'F1'} ${size} Tf ${xx.toFixed(1)} ${(H - y).toFixed(1)} Td (${clean(t)}) Tj ET`);
  };
  const rect = (x, y, w, h, color) => ops.push(`${rgb(color)} rg ${x} ${H - y - h} ${w} ${h} re f`);
  const line = (y, color = '#E3EAF2', wd = 0.8) => ops.push(`${rgb(color)} RG ${wd} w 30 ${H - y} m ${W - 30} ${H - y} l S`);
  rect(30, 28, 42, 42, '#D7191F'); text(51, 53, 'SKDMB', 8, true, '#FFFFFF', 'center');
  text(80, 44, BRAND.full, 12, true); text(80, 60, 'Monthly doodh bill - ' + d.month, 9, false, '#5B6673');
  line(80, '#D7191F', 2);
  text(30, 100, 'Bill to', 8, false, '#5B6673'); text(30, 113, d.name, 11, true); text(30, 126, d.address, 9);
  text(W - 30, 100, 'Customer ID', 8, false, '#5B6673', 'right'); text(W - 30, 113, d.id, 11, true, '#1F2A37', 'right');
  let y = 152;
  const row = (a, b, bold) => { text(30, y, a, 9.5, bold, bold ? '#1F2A37' : '#5B6673'); text(W - 30, y, b, 9.5, true, '#1F2A37', 'right'); line(y + 7); y += 20; };
  text(30, y, 'DOODH', 8.5, true, '#5B6673'); y += 16;
  row(`Doodh (${d.milk}): roz ${d.def} L x ${d.days} din`, (d.def * d.days) + ' L');
  if (d.change) row('Badlaav (extra / kam / ghar band)', (d.change > 0 ? '+' : '') + d.change + ' L');
  row(`Kul doodh ${d.litres} L x ${R(d.rate)}`, R(d.milkAmt), true);
  if (d.items.length) { y += 8; text(30, y, 'OTHER SAMAN', 8.5, true, '#5B6673'); y += 16; d.items.forEach(i => row(`${i.item}: ${Math.round(i.qty * 100) / 100} ${i.unit} x ${R(i.rate)}`, R(i.amount))); row('Kul saman', R(d.other), true); }
  y += 8; rect(30, y, W - 60, 62, '#FFF4D2');
  text(42, y + 18, 'Bill amount', 10); text(W - 42, y + 18, R(d.bill), 10, true, '#1F2A37', 'right');
  text(42, y + 34, 'Jama', 10); text(W - 42, y + 34, R(d.paid), 10, true, '#1F2A37', 'right');
  text(42, y + 52, 'Kul baaki', 12, true); text(W - 42, y + 52, R(d.balance), 12, true, '#1F2A37', 'right'); y += 82;
  if (d.payments.length) { text(30, y, 'Jama: ' + d.payments.map(p => showDate(p.date) + ' ' + R(p.amount) + ' (' + p.mode + ')').join(', '), 8, false, '#5B6673'); y += 16; }
  text(30, y, 'Payment: UPI ' + UPI_ID + ' ya delivery boy ko cash.', 9);
  text(W / 2, H - 30, 'Billing system by Jinovate - jinovate.com', 6.5, false, '#6B7280', 'center');
  const content = ops.join('\n');
  const objs = ['<< /Type /Catalog /Pages 2 0 R >>', '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>`,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>', '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
    `<< /Length ${content.length} >>\nstream\n${content}\nendstream`];
  let out = '%PDF-1.4\n'; const offs = [];
  objs.forEach((o, i) => { offs.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const xref = out.length;
  out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('') + `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new Blob([out], { type: 'application/pdf' });
}
async function deliverFile(blob, name) {
  const dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) { try { await dl.save({ filename: name, data: blob }); toast('PDF save ho gayi'); } catch (e) { if (e.code !== 'declined') toast('PDF save nahi ho payi'); } return; }
  const file = new File([blob], name, { type: 'application/pdf' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
// Android Chrome allows share() only right after a tap. So: tap 1 fetches the PDF, tap 2 shares it.
function downloadFile(file) { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000); }
function sendReadyPdf() {
  const f = V.pdfFile; if (!f) return;
  if (navigator.canShare && navigator.canShare({ files: [f] })) {
    navigator.share({ files: [f], title: f.name }).catch(e => { if (e.name !== 'AbortError') { downloadFile(f); toast('PDF download ho gayi'); } });
  } else { downloadFile(f); toast('PDF download ho gayi'); }
}
async function sharePdf() {
  const b = $('#pdfbtn');
  if (V.pdfFile && V.pdfFor === V.billId + '|' + JSON.stringify(curPeriod())) return sendReadyPdf();
  b.disabled = true; b.textContent = 'PDF ban rahi hai…';
  try {
    const d = V.billMsg;
    if (DEMO) { await deliverFile(makeBillPdf(d), `${d.id} ${d.name} - ${d.month}.pdf`); b.textContent = 'PDF share / download karo'; return; }
    const p = curPeriod(); const r = await api('billPdf', { custId: V.billId, from: p.from, to: p.to });
    const bytes = Uint8Array.from(atob(r.base64), c => c.charCodeAt(0));
    V.pdfFile = new File([bytes], r.name, { type: 'application/pdf' }); V.pdfFor = V.billId + '|' + JSON.stringify(p);
    b.textContent = '📤 PDF taiyaar – bhejne ke liye dabao';
    if (!$('#pdfdl')) b.insertAdjacentHTML('afterend', '<button class="btn out" id="pdfdl" onclick="downloadFile(V.pdfFile);toast(\'PDF download ho gayi\')">⬇️ Sirf phone mein save karo</button>');
  } catch (e) { toast(e.message); b.textContent = 'PDF share / download karo'; }
  finally { b.disabled = false; }
}

const BOY_NAV = [['route', 'Mera Route', 'route'], ['din', 'Mera din', 'pay']];
const OWNER_NAV = [['aaj', 'Aaj', 'sum'], ['bills', 'Bills', 'bill'], ['route', 'Route', 'route']];
let renderSeq = 0;
async function render() {
  const app = $('#app');
  if (S && !DEMO && S.day !== todayStr()) { logout(true); toast('Naya din: dobara login karo'); return; } // roz raat 12 baje logout
  if (PUBLIC_KEY) { app.innerHTML = '<div class="spin"></div>'; app.innerHTML = await publicHtml(); return; }
  if (!S) { app.innerHTML = loginHtml(); return; }
  if (!V.tab) V.tab = isOwner() ? 'aaj' : 'route';
  const seq = ++renderSeq;
  const navHtml = nav(isOwner() ? OWNER_NAV : BOY_NAV);
  if (V.about) { app.innerHTML = aboutView() + (V.menu ? menuHtml() : ''); return; }
  app.innerHTML = header('…') + '<div class="body"><div class="spin" role="status" aria-label="Load ho raha hai"></div></div>' + navHtml;
  try {
    if (V.billId && V.tab === 'bills') { const html = await billView(); if (seq === renderSeq) app.innerHTML = html + navHtml + (V.menu ? menuHtml() : ''); return; }
    const views = { rates: ratesView, staff: staffView, route: routeView, change: changeView, saman: samanView, payment: paymentView, ghar: houseView, chhutti: chhuttiView, din: dinView, aaj: aajView, bills: billsView };
    const html = await (views[V.tab] || routeView)();
    if (seq !== renderSeq) return;
    app.innerHTML = html + navHtml + (V.menu ? menuHtml() : '');
  } catch (e) {
    if (seq !== renderSeq || !S) return;
    app.innerHTML = header('SKDMB Doodh') + `<div class="body"><p class="empty">${esc(e instanceof TypeError ? 'Network nahi hai. Thodi der baad Refresh dabao.' : e.message)}</p></div>` + navHtml;
  }
}
